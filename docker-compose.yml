version: '3.9'

services:
  # ============================================================================
  # PostgreSQL 15 + PostGIS
  # ============================================================================
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: immobilier-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: immobilier_saas
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immobilier-network

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: immobilier-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - immobilier-network

  # ============================================================================
  # MinIO S3-Compatible Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: immobilier-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - immobilier-network

  # Create default bucket
  minio-setup:
    image: minio/mc:latest
    container_name: immobilier-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/immobilier-saas-uploads --ignore-existing;
      mc anonymous set public myminio/immobilier-saas-uploads;
      exit 0;
      "
    networks:
      - immobilier-network

  # ============================================================================
  # NATS Message Queue
  # ============================================================================
  nats:
    image: nats:2.10-alpine
    container_name: immobilier-nats
    command: "-js -m 8222"  # Enable JetStream and monitoring
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
    volumes:
      - nats_data:/data
    networks:
      - immobilier-network

  # ============================================================================
  # MailHog (Email Testing)
  # ============================================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: immobilier-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - immobilier-network

  # ============================================================================
  # Go API Service (with hot reload)
  # ============================================================================
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    container_name: immobilier-api
    environment:
      - ENVIRONMENT=development
      - PORT=8080
      - APP_URL=http://localhost:8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/immobilier_saas?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=immobilier-saas-uploads
      - S3_USE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./services/api:/app
      - /app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - immobilier-network
    restart: unless-stopped

  # ============================================================================
  # Next.js Web App (with hot reload)
  # ============================================================================
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile.dev
    container_name: immobilier-web
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - API_URL=http://api:8080
    ports:
      - "3000:3000"
    volumes:
      - ./services/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - immobilier-network
    restart: unless-stopped

  # ============================================================================
  # Prometheus (Metrics)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: immobilier-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/config.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - immobilier-network

  # ============================================================================
  # Grafana (Visualization)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: immobilier-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - immobilier-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  nats_data:
  prometheus_data:
  grafana_data:

networks:
  immobilier-network:
    driver: bridge
