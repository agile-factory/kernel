services:
  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-myapp}-postgres
    environment:
      POSTGRES_USER: ${APP_NAME:-myapp}
      POSTGRES_PASSWORD:  ${APP_NAME:-myapp}_dev_password
      POSTGRES_DB: ${APP_NAME:-myapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U  ${APP_NAME:-myapp} -d  ${APP_NAME:-myapp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - boilerplate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-myapp}-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${APP_NAME:-myapp}:${APP_NAME:-myapp}_dev_password@postgres:5432/${APP_NAME:-myapp}
      JWT_SECRET: dev_jwt_secret_change_in_production_please
      APP_ENV: development
      LOG_LEVEL: debug
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - boilerplate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${APP_NAME:-myapp}-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - boilerplate-network

volumes:
  postgres_data:

networks:
  boilerplate-network:
    driver: bridge
