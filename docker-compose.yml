services:
  postgres:
    image: postgres:16-alpine
    container_name: lokatik-postgres
    environment:
      POSTGRES_USER: lokatik
      POSTGRES_PASSWORD: lokatik_dev_password
      POSTGRES_DB: lokatik
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lokatik -d lokatik"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lokatik-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lokatik-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://lokatik:lokatik_dev_password@postgres:5432/lokatik
      JWT_SECRET: dev_jwt_secret_change_in_production_please
      APP_ENV: development
      LOG_LEVEL: debug
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lokatik-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lokatik-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - lokatik-network

volumes:
  postgres_data:

networks:
  lokatik-network:
    driver: bridge
