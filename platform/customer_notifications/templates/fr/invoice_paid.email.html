<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Paiement reçu — {{.TenantAppName}}</title></head>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:0 auto;padding:20px">
  {{if .TenantLogoURL}}<img src="{{.TenantLogoURL}}" alt="{{.TenantAppName}}" style="max-height:60px;margin-bottom:20px"><br>{{end}}
  <h2 style="color:{{if .TenantPrimaryColor}}{{.TenantPrimaryColor}}{{else}}#000{{end}}">Paiement confirmé</h2>
  <p>Bonjour {{.CustomerFirstName}},</p>
  <p>Votre paiement de <strong>{{.InvoiceAmount}} {{.InvoiceCurrency}}</strong> a bien été reçu.</p>
  <p>Merci de votre confiance.</p>
  {{if .SupportEmail}}<p>Questions ? <a href="mailto:{{.SupportEmail}}">{{.SupportEmail}}</a></p>{{end}}
</body>
</html>
