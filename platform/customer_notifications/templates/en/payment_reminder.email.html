<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Payment reminder — {{.TenantAppName}}</title></head>
<body style="font-family:sans-serif;color:#333;max-width:600px;margin:0 auto;padding:20px">
  {{if .TenantLogoURL}}<img src="{{.TenantLogoURL}}" alt="{{.TenantAppName}}" style="max-height:60px;margin-bottom:20px"><br>{{end}}
  <h2 style="color:{{if .TenantPrimaryColor}}{{.TenantPrimaryColor}}{{else}}#000{{end}}">Payment reminder</h2>
  <p>Hello {{.CustomerFirstName}},</p>
  <p>A payment of <strong>{{.InvoiceAmount}} {{.InvoiceCurrency}}</strong> is pending on your account.</p>
  <p>Please settle it at your earliest convenience.</p>
  {{if .SupportEmail}}<p>Questions? <a href="mailto:{{.SupportEmail}}">{{.SupportEmail}}</a></p>{{end}}
</body>
</html>
